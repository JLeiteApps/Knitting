name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      # Gate: no known vulnerabilities in the APP dependency tree
      # (tools/ — the local book-OCR package — is deliberately outside CI).
      - run: npm audit --audit-level=high
